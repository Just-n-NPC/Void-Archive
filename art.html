<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Showcase - An'tiri's Void</title>
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=AngelicWar&display=swap" rel="stylesheet">

  <style>
    /* General art page styling */
    body.art-page {
      background: linear-gradient(135deg, #0d0d0d, #1a0f1f);
      color: #f0e6ff;
      font-family: 'AngelicWar', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 2rem;
      background: rgba(20, 10, 20, 0.85);
      box-shadow: 0 0 20px rgba(150, 100, 200, 0.4);
    }
    header h1 {
      font-size: 2.5rem;
      color: #d4bfff;
      margin-bottom: 0.5rem;
    }
    header p {
      color: #bda7e0;
      font-size: 1.1rem;
    }

    /* Section styling */
    .art-section {
      margin: 3rem auto;
      max-width: 1200px;
      padding: 2rem;
      background: rgba(30, 20, 40, 0.7);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(200, 150, 255, 0.2);
    }
    .art-section h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #e0caff;
      border-bottom: 2px solid #553377;
      padding-bottom: 0.5rem;
      text-align: center;
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(200, 150, 255, 0.6);
    }

    /* Flipbook styles */
    .flipbook-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .flipbook img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
    }
    .flipbook-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .flipbook-controls button {
      background: #2a1f36;
      color: #e0caff;
      border: 1px solid #6a4a8c;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 6px;
      transition: background 0.3s, transform 0.2s;
    }
    .flipbook-controls button:hover {
      background: #3d2a57;
      transform: scale(1.05);
    }
    #page-counter {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #cdb5ff;
    }
  </style>
</head>
<body class="art-page">
  <header>
    <h1>Art Showcase</h1>
    <p>Wander through the echoes of imagination.</p>
  </header>

  <main class="art-page">
    <!-- Illustrations Section -->
    <section class="art-section">
      <h2>Illustrations</h2>
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/in-the-mind.png" alt="Illustration 1">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/illustration2.png" alt="Illustration 2">
      </div>
    </section>

    <!-- Concept Art Section -->
    <section class="art-section">
      <h2>Concept Art</h2>
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/concept1.png" alt="Concept Art 1">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/concept2.png" alt="Concept Art 2">
      </div>
    </section>

    <!-- One-Shot Comics Section -->
    <section class="art-section">
      <h2>One-Shot Comics</h2>
      <div class="flipbook-container">
        <div class="flipbook">
          <img id="comic-page" src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/1.png" alt="Comic Page 1">
        </div>
        <div class="flipbook-controls">
          <button onclick="prevPage()">⬅ Prev</button>
          <button onclick="nextPage()">Next ➡</button>
        </div>
        <p id="page-counter">Page 1 of 26</p>
      </div>
    </section>

    <!-- Character Designs Section -->
    <section class="art-section">
      <h2>Character Designs</h2>
      <div class="gallery">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/character1.png" alt="Character Design 1">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/character2.png" alt="Character Design 2">
        <img src="https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/rhae-and-auia-5-1.png" alt="Character Design 3">
      </div>
    </section>
  </main>

  <script>
  const totalPages = 26;
  let currentPage = 1;

  const comicImg = document.getElementById("comic-page");
  const counter = document.getElementById("page-counter");
  const flipbook = document.querySelector(".flipbook");

  function updatePage() {
    comicImg.src = `https://raw.githubusercontent.com/Just-n-NPC/Void-Archive/refs/heads/main/images/${currentPage}.png`;
    comicImg.alt = `Comic Page ${currentPage}`;
    counter.textContent = `Page ${currentPage} of ${totalPages}`;
  }

  function nextPage() {
    if (currentPage < totalPages) {
      currentPage++;
      updatePage();
    }
  }

  function prevPage() {
    if (currentPage > 1) {
      currentPage--;
      updatePage();
    }
  }

  // Fullscreen on first page click
  comicImg.addEventListener("click", () => {
    if (currentPage === 1) {
      if (flipbook.requestFullscreen) {
        flipbook.requestFullscreen();
      } else if (flipbook.webkitRequestFullscreen) {
        flipbook.webkitRequestFullscreen();
      } else if (flipbook.msRequestFullscreen) {
        flipbook.msRequestFullscreen();
      }
    }
  });

  // Keyboard navigation
  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") {
      nextPage();
    } else if (event.key === "ArrowLeft") {
      prevPage();
    }
  });

  // Reset to first page when exiting fullscreen
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
      currentPage = 1;
      updatePage();
    }
  });
</script>

</body>
</html>
